<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Background -->
  <rect width="400" height="400" fill="#ffffff"/>
  
  <!-- Semicircular arch -->
  <path d="M 100 250 A 100 100 0 0 1 300 250" fill="none" stroke="#2F4F3A" stroke-width="3"/>
  
  <!-- Document sheet with folded corner -->
  <g>
    <!-- Main document body -->
    <rect x="130" y="175" width="140" height="75" fill="#EFE6D5"/>
    
    <!-- Folded corner -->
    <path d="M 240 175 L 240 200 L 265 200 Z" fill="#2F4F3A"/>
    
    <!-- Document lines -->
    <line x1="150" y1="195" x2="220" y2="195" stroke="#2F4F3A" stroke-width="1.5" opacity="0.4"/>
    <line x1="150" y1="208" x2="210" y2="208" stroke="#2F4F3A" stroke-width="1.5" opacity="0.4"/>
    <line x1="150" y1="221" x2="225" y2="221" stroke="#2F4F3A" stroke-width="1.5" opacity="0.4"/>
  </g>
  
  <!-- Text -->
  <text x="200" y="310" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="bold" fill="#2F4F3A" letter-spacing="5">РГАСПИ</text>
  
  <!-- Decorative line -->
  <line x1="150" y1="325" x2="250" y2="325" stroke="#2F4F3A" stroke-width="1.5"/>
  
  <!-- Subtitle -->
  <text x="200" y="348" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#2F4F3A" letter-spacing="2" opacity="0.7">АРХИВ СОЦИАЛЬНО-ПОЛИТИЧЕСКОЙ ИСТОРИИ</text>
</svg>
